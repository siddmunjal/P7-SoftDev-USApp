{% extends "base.html" %}

{% block content %}
<h2>Clubs points board</h2>
<table>
    <thead>
        <tr>
            <th>Club</th>
            <th>Points available</th>
        </tr>
    </thead>
    <tbody>
        {% for club in clubs %}
        <tr>
            <td>{{club['name']}}</td>
            <td>{{club['points']}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{{url_for('index')}}">Back to homepage</a>
{% endblock %}
